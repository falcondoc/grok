name: Refresh Working HLS Playlist

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run probe + rewrite
        run: |
          python3 refresh_hls_m3u.py working_hls_live.m3u

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_hls_live.m3u
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh working_hls_live.m3u ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
